<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SkillMatch - Analyze</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><nav class="navbar navbar-dark bg-dark px-3"><a class="navbar-brand" href="index.html">SkillMatch</a><div><a class="btn btn-sm btn-outline-light me-2" href="history.html">History</a><button id="themeBtn" class="btn btn-sm btn-outline-light">Dark/Light</button></div></nav><main class="container my-4">

</form>
